name: Repository Intelligence Batch Analysis

on:
  workflow_dispatch:

jobs:
  analyze-repositories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install cloc utility
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch all repository URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ANALYSIS_TOKEN }}
        run: python fetch_all_repo.py

      - name: Run Repo Analysis Tool
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ANALYSIS_TOKEN }}
        run: |
          python Repo_analysis_tool.py --batch clone_urls.txt --github-token "$GITHUB_TOKEN" --output-dir ./outputs

      - name: Fetch username from API or fallback
        id: get_username
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ANALYSIS_TOKEN }}
        run: |
          UNAME=""
          if [ -n "$GITHUB_TOKEN" ]; then
            UNAME=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user | jq -r '.login // empty')
          fi
          if [ -z "$UNAME" ]; then
            UNAME="${{ github.repository_owner }}"
          fi
          echo "username=$UNAME" >> $GITHUB_OUTPUT
          echo "Determined Username: $UNAME"

      - name: Commit and Push Outputs to New Branch 'output-of-<username>[-N]'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ANALYSIS_TOKEN }}
          UNAME: ${{ steps.get_username.outputs.username }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin

          BASE_BRANCH="output-of-${UNAME}"
          TARGET_BRANCH="$BASE_BRANCH"

          # Check if base branch exists
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH"; then
            NUM=1
            while git ls-remote --exit-code --heads origin "${BASE_BRANCH}-${NUM}"; do
              NUM=$((NUM + 1))
            done
            TARGET_BRANCH="${BASE_BRANCH}-${NUM}"
          fi

          echo "Target Branch Name: $TARGET_BRANCH"

          # Create orphan branch for clean output storage
          git checkout --orphan "$TARGET_BRANCH"
          git rm -rf . || true

          # Copy generated outputs to root of the new branch
          cp -r outputs/* ./ || true

          # Commit and push changes
          git add .
          git commit -m "Analysis results for $UNAME [skip ci]"
          git push origin "$TARGET_BRANCH"



